<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мои цветы</title>
<link rel="preload" href="/fonts/icons.woff2?v=3" as="font" type="font/woff2" crossorigin>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg:#EEF1EC; --card:#FFFFFF; --soft:#F4F6F3; --text:#1C211D; --muted:#8A938B; --line:#ECEFEA; --ring:#D3DACF;
  --sage:#5E7C55; --sage-dark:#3E5638; --sage-soft:#E3EBDE; --lime:#EBF1D2; --lime-text:#5E6B2A; --warm:#F6E9DD; --warm-text:#9A5B32;
  --ink:#1F2621; --ink-text:#FFFFFF;
  --green:linear-gradient(155deg, #7D9970 0%, #5E7C55 45%, #3F5839 100%);
}
.dark {
  --bg:#121513; --card:#1B1F1C; --soft:#222723; --text:#EDF1EB; --muted:#7E877F; --line:#262B27; --ring:#3A423B;
  --sage:#86A67A; --sage-dark:#A9C69C; --sage-soft:#26311F; --lime:#2C3220; --lime-text:#C9D69A; --warm:#33271E; --warm-text:#E2A57A;
  --ink:#EDF1EB; --ink-text:#121513;
  --green:linear-gradient(155deg, #5B7651 0%, #435E3D 50%, #2D4029 100%);
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
/* Шрифты лежат у нас, а не в Google Fonts: у части людей Google Fonts не грузится, и вместо значков видны слова.
   icons.woff2 — только значки, которые есть в app.js. Новый значок — пересобрать файл (см. README) и поднять ?v=. */
@font-face { font-family:'Material Symbols Rounded'; font-style:normal; font-weight:300 500; font-display:block; src:url(/fonts/icons.woff2?v=3) format('woff2'); }
@font-face { font-family:'Manrope'; font-style:normal; font-weight:300 600; font-display:swap; src:url(/fonts/manrope-cyrillic.woff2) format('woff2'); unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family:'Manrope'; font-style:normal; font-weight:300 600; font-display:swap; src:url(/fonts/manrope-latin.woff2) format('woff2'); unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 Manrope, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing:antialiased; }
button { font:inherit; color:inherit; }
main { padding:8px 16px 40px; max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:12px; }

.ms { font-family:'Material Symbols Rounded'; font-weight:normal; font-style:normal; font-size:20px; line-height:1; letter-spacing:normal; text-transform:none; white-space:nowrap; direction:ltr; font-feature-settings:'liga'; -webkit-font-feature-settings:'liga'; font-variation-settings:'FILL' 0, 'wght' 400, 'opsz' 24; display:inline-block; flex:none; width:1em; height:1em; overflow:hidden; }
/* Значок не шире своей клетки, а пока шрифт значков не загрузился, его не видно: вёрстка не едет, даже если шрифт не пришёл. */
html:not(.icons) .ms { color:transparent !important; }

.tabs { position:sticky; top:0; z-index:5; display:flex; gap:4px; margin:0 auto; max-width:560px; padding:12px 16px 10px; background:var(--bg); }
.tabs button { flex:1 1 auto; display:flex; align-items:center; justify-content:center; gap:5px; border:0; background:var(--card); color:var(--muted); font-size:13.5px; font-weight:500; padding:10px 8px; border-radius:99px; cursor:pointer; white-space:nowrap; }
.tabs button .ms { font-size:18px; }
.tabs button.on { background:var(--sage); color:#fff; }
.tabs .theme-btn { flex:none; width:40px; padding:0; }
.tabs .theme-btn .ms { font-size:19px; }
/* Четыре вкладки на узком телефоне: без значка у «Скан» и чуть мельче. */
@media (max-width:389px) { .tabs { gap:3px; padding-left:12px; padding-right:12px; } .tabs button { font-size:13px; padding:10px 6px; } .tabs button:not(.theme-btn) .ms { display:none; } .tabs .theme-btn { width:38px; } }

.headline { padding:14px 4px 4px; }
.label { margin:0 0 10px; font-size:13px; color:var(--muted); }
h1 { margin:0; font-size:30px; line-height:1.12; font-weight:400; letter-spacing:-.035em; }
h1 span { color:var(--muted); font-weight:300; }
.topbar { display:flex; padding-top:4px; }

.card { background:var(--card); border-radius:28px; padding:20px; border:0; text-align:left; }
.card-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:14px; }
h3 { margin:0; font-size:19px; font-weight:500; letter-spacing:-.02em; }
.card-head p { margin:3px 0 0; font-size:13px; color:var(--muted); }
.circle { flex:none; width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:var(--card); display:grid; place-items:center; cursor:pointer; color:var(--text); padding:0; }

.card.green { background:var(--green); color:#fff; }
.card.green .card-head p { color:rgba(255,255,255,.72); }
.circle.light { background:rgba(255,255,255,.14); border-color:rgba(255,255,255,.22); color:#fff; }
.big { font-size:44px; font-weight:300; letter-spacing:-.04em; line-height:1; margin:4px 0 14px; }
.big span { opacity:.55; font-size:26px; }
/* Прогресс как в сторис: тонкие скруглённые полоски с зазорами, пройденные белые. */
.segs { display:flex; gap:5px; height:8px; margin-bottom:16px; }
.segs span { flex:1; border-radius:99px; background:rgba(255,255,255,.3); transition:background .3s; }
.segs span.on { background:#fff; }
.inner { background:var(--card); color:var(--text); border-radius:20px; padding:4px 10px; }
.card.water { padding:14px 16px 16px 18px; }
.tag-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.tag-row small { font-size:13px; color:rgba(255,255,255,.72); }
.card.water .tag-row + * { margin-top:10px; }
.tag { display:inline-flex; align-items:center; gap:4px; padding:3px 10px 3px 7px; border-radius:99px; background:rgba(255,255,255,.16); font-size:12.5px; font-weight:500; color:#fff; }
.tag .ms { font-size:15px; }
.card.water .big { margin:12px 0; }
.next-water { display:flex; align-items:center; gap:14px; width:100%; border:0; padding:0; background:none; color:#fff; text-align:left; cursor:pointer; }
.next-water .txt { flex:1; min-width:0; display:flex; flex-direction:column; align-items:flex-start; gap:10px; }
.next-water .line { font-size:14px; line-height:1.35; color:rgba(255,255,255,.85); }
.next-water .thumb { width:48px; height:48px; border-radius:15px; background:rgba(255,255,255,.14); color:#fff; }

.rows { margin:0 -4px; }
.row { display:flex; align-items:center; gap:6px; width:100%; padding:8px 0; border:0; border-top:1px solid var(--line); background:none; text-align:left; }
.rows .row:first-child, .inner .row:first-child { border-top:0; }
.hit { display:flex; align-items:center; gap:12px; border:0; background:none; padding:4px; cursor:pointer; text-align:left; }
.hit.grow { flex:1; min-width:0; }
.row.done .txt b { color:var(--muted); }
.txt { flex:1; display:flex; flex-direction:column; gap:1px; min-width:0; }
.txt b { font-weight:500; font-size:15px; }
.txt small { color:var(--muted); font-size:12.5px; }
.check { flex:none; width:26px; height:26px; border-radius:9px; border:1.5px solid var(--ring); display:grid; place-items:center; color:#fff; transition:all .2s; }
.check.on { background:var(--sage); border-color:var(--sage); }
.check .ms { font-size:18px; font-variation-settings:'FILL' 0, 'wght' 600, 'opsz' 20; }
.thumb { flex:none; width:44px; height:44px; border-radius:14px; overflow:hidden; background:var(--soft); display:grid; place-items:center; color:var(--muted); }
.thumb img, .pic img, .photo img { width:100%; height:100%; object-fit:cover; display:block; }
/* В миниатюрах фото лежит поверх рамки целиком: так Safari не сдвигает и не обрезает его. */
.thumb, .pic { position:relative; }
.thumb img, .pic img { position:absolute; inset:0; }
.row.done .thumb img { opacity:.6; }

.chip { flex:none; display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:500; padding:5px 10px; border-radius:99px; background:var(--soft); color:var(--muted); white-space:nowrap; }
.chip .ms { font-size:15px; }
.chip.sage { background:var(--sage-soft); color:var(--sage-dark); }
.chip.lime { background:var(--lime); color:var(--lime-text); }
.chip.warm { background:var(--warm); color:var(--warm-text); }
.chips { display:flex; flex-wrap:wrap; gap:6px; padding:0 4px; }
.chips .chip { font-size:13px; padding:7px 12px; }

.pill { display:flex; align-items:center; justify-content:space-between; width:100%; padding:6px 6px 6px 22px; border:0; border-radius:99px; background:var(--ink); color:var(--ink-text); font-weight:500; cursor:pointer; }
.pill i { width:42px; height:42px; border-radius:50%; background:var(--sage); color:#fff; display:grid; place-items:center; font-style:normal; }
.pill.light { margin-top:12px; background:rgba(255,255,255,.95); color:#2D4029; }
.card .pill { margin-top:16px; }

.scan-cta { display:flex; align-items:center; gap:14px; width:100%; cursor:pointer; color:var(--text); }
.scan-cta .circle { background:var(--sage-soft); border:0; color:var(--sage-dark); }

.tiles { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.tile { position:relative; display:flex; flex-direction:column; border:0; padding:6px; border-radius:24px; background:var(--card); text-align:left; cursor:pointer; }
.pic { display:grid; place-items:center; width:100%; aspect-ratio:3/4; border-radius:19px; overflow:hidden; background:var(--soft); color:var(--muted); }
.pic .ms { font-size:30px; }
.tile.add .pic { border:1.5px dashed var(--ring); background:none; }
.tile-body { display:flex; flex-direction:column; align-items:flex-start; gap:8px; padding:10px 8px 6px; }
.tile-body b { font-weight:500; font-size:14px; line-height:1.25; min-height:2.5em; }
.tile-body small { color:var(--muted); font-size:12.5px; margin-top:-6px; }
.flag { position:absolute; top:14px; right:14px; width:32px; height:32px; border-radius:50%; display:grid; place-items:center; }
.flag.lime { background:var(--lime); color:var(--lime-text); } .flag.warm { background:var(--warm); color:var(--warm-text); }
.flag .ms { font-size:18px; }

.hero-photo { position:relative; }
.photo { display:grid; place-items:center; width:100%; aspect-ratio:4/3; border-radius:28px; overflow:hidden; background:var(--card); color:var(--muted); }
.photo .ms { font-size:44px; }
/* Большое фото в карточке цветка, в скане и в галерее: одна рамка 3:4 на всю ширину, не выше 54% экрана.
   Фото заполняет рамку целиком и кадрируется по центру. */
.hero-photo .photo:not(.empty), .gallery .photo { display:block; aspect-ratio:3/4; max-height:54vh; }
.hero-photo .photo:not(.empty) img, .gallery .photo img { object-fit:cover; object-position:center; }
/* Несколько фото листаются вбок. Рамка одна на всех, фото целиком, без обрезки. */
.gallery .slides { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; overscroll-behavior-x:contain; scrollbar-width:none; border-radius:28px; }
.gallery .slides::-webkit-scrollbar { display:none; }
.gallery .slide { flex:0 0 100%; scroll-snap-align:center; scroll-snap-stop:always; }
.gallery .photo { border-radius:0; }
.dots { display:flex; justify-content:center; gap:6px; margin-top:10px; }
.dots button { width:7px; height:7px; padding:0; border:0; border-radius:4px; background:var(--ring); cursor:pointer; transition:width .2s, background .2s; }
.dots button.on { width:20px; background:var(--sage); }
.scanning { position:absolute; inset:0; border-radius:28px; overflow:hidden; background:rgba(30,40,30,.25); }
.scanning i { position:absolute; left:0; right:0; height:3px; background:#fff; box-shadow:0 0 18px 4px rgba(255,255,255,.7); animation:sweep 1.6s ease-in-out infinite alternate; }
@keyframes sweep { from { top:6%; } to { top:94%; } }

.water-btn { flex:none; display:flex; align-items:center; gap:6px; border:0; border-radius:99px; padding:9px 14px 9px 12px; background:var(--sage-soft); color:var(--sage-dark); font-weight:500; font-size:14px; cursor:pointer; }
.water-btn.on { background:var(--sage); color:#fff; }
.water-btn .ms { font-size:18px; }
.stepper { display:flex; align-items:center; gap:10px; background:var(--soft); border-radius:18px; padding:8px 8px 8px 16px; }
.stepper span { color:var(--muted); font-size:14px; flex:1; }
.stepper b { font-weight:500; font-size:16px; min-width:72px; text-align:center; }
.hint { display:flex; align-items:center; gap:8px; width:100%; margin-top:10px; border:0; background:var(--lime); color:var(--lime-text); border-radius:14px; padding:10px 12px; font-size:13px; font-weight:500; text-align:left; cursor:pointer; }
.hint .ms { font-size:18px; }

.facts { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px; }
.facts li { display:flex; gap:12px; align-items:center; font-size:15px; }
.facts .ms { flex:none; width:32px; height:32px; border-radius:10px; background:var(--soft); color:var(--sage); display:grid; place-items:center; font-size:19px; }
.card.todo { background:var(--warm); }
.card.todo .facts .ms { background:rgba(255,255,255,.6); color:var(--warm-text); }
.dark .card.todo .facts .ms { background:rgba(0,0,0,.2); }
.empty-card p { margin:0; color:var(--muted); }
.note { margin:0 4px; font-size:13px; color:var(--warm-text); }
.link-btn { display:flex; align-items:center; justify-content:center; gap:6px; border:0; background:none; color:var(--muted); font-size:13px; padding:8px; cursor:pointer; }
.link-btn .ms { font-size:17px; }

.camera { display:flex; flex-direction:column; align-items:center; gap:6px; width:100%; padding:44px 20px; cursor:pointer; color:var(--text); text-align:center; }
.lens { width:84px; height:84px; border-radius:50%; background:var(--green); color:#fff; display:grid; place-items:center; margin-bottom:10px; }
.lens .ms { font-size:36px; }
.camera b { font-weight:500; font-size:18px; }
.camera small { color:var(--muted); }
.pick { display:flex; flex-wrap:wrap; gap:6px; }
.toggle { border:1px solid var(--ring); background:none; font-size:13px; font-weight:500; padding:7px 13px; border-radius:99px; cursor:pointer; }

.toggle.on { background:var(--sage-soft); border-color:var(--sage); color:var(--sage-dark); }
.toggle.date { position:relative; display:inline-flex; align-items:center; gap:4px; overflow:hidden; }
.toggle.date .ms { font-size:16px; }
.toggle.date input { position:absolute; inset:0; width:100%; height:100%; opacity:0; border:0; margin:0; padding:0; cursor:pointer; }
.ask { margin-bottom:14px; }
.ask p { margin:0 0 10px; font-size:14px; }
.link-row { display:flex; align-items:center; gap:8px; width:100%; border:0; background:none; padding:0; margin:-2px 0 14px; font-size:13.5px; color:var(--muted); cursor:pointer; text-align:left; }
.link-row .ms { font-size:18px; }
.link-row b { margin-left:auto; color:var(--sage-dark); font-weight:500; }
.sub { margin:16px 0 8px; font-size:13px; color:var(--muted); }
.wait { opacity:.55; pointer-events:none; }
.wait-line { margin:0 4px; display:flex; gap:10px; align-items:baseline; font-size:13px; color:var(--muted); }
.wait-line b { font-weight:600; font-size:15px; color:var(--text); font-variant-numeric:tabular-nums; }
.pill[disabled] { opacity:.5; }
.pill span { text-align:left; }
.pill span small { display:block; margin-top:1px; font-size:12.5px; font-weight:400; opacity:.6; }
.row .toggle { flex:none; }
.gardens { display:flex; gap:6px; overflow-x:auto; padding:2px 0; scrollbar-width:none; }
.gardens button { flex:none; display:flex; align-items:center; gap:6px; border:0; background:var(--card); color:var(--muted); font-size:13px; font-weight:500; padding:8px 14px; border-radius:99px; cursor:pointer; }
.gardens button .ms { font-size:17px; }
.gardens button.on { background:var(--ink); color:var(--ink-text); }
/* Заголовок «Мои цветы» и справа значок сортировки с выпадающим списком. */
.head-row { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; }
.head-row .headline { flex:1; min-width:0; }
.sort-wrap { position:relative; flex:none; margin-bottom:8px; }
.sort-btn.on { background:var(--ink); color:var(--ink-text); }
.menu { position:absolute; right:0; top:calc(100% + 6px); z-index:6; min-width:200px; background:var(--card); border-radius:18px; padding:6px; box-shadow:0 10px 30px rgba(20,30,20,.16), 0 0 0 1px var(--line); display:flex; flex-direction:column; }
.menu button { display:flex; align-items:center; justify-content:space-between; gap:10px; border:0; background:none; color:var(--text); font-size:14.5px; padding:11px 12px; border-radius:12px; text-align:left; cursor:pointer; }
.menu button.on { background:var(--soft); font-weight:500; }
.menu button .ms { font-size:18px; color:var(--sage); }
.dark .menu { box-shadow:0 10px 30px rgba(0,0,0,.5), 0 0 0 1px var(--line); }
.loading.small { min-height:80px; }

/* Полив с удобрением */
.feed-why { margin:10px 4px 0; font-size:13px; color:var(--muted); }
.link-row + .feed-why { margin:-6px 0 14px; }
.feed-facts { gap:10px; }
.feed-facts li { font-size:14px; }
.feed-facts .ms { width:28px; height:28px; font-size:17px; border-radius:9px; }
.feed-facts + .feed-why { margin:12px 4px 14px; }
.feed-facts + .stepper, .feed-facts + .hint { margin-top:14px; }
.feed-mix { margin:-4px 2px 12px; font-size:13.5px; color:rgba(255,255,255,.8); }
.feed-mix b { font-weight:500; color:#fff; }
.hint.warm { background:var(--warm); color:var(--warm-text); }
.facts + .hint { margin-top:14px; }

/* Сорт вручную */
.edit-name { align-self:flex-start; display:inline-flex; align-items:center; gap:5px; margin:-8px 4px 0; padding:4px 0; border:0; background:none; color:var(--sage-dark); font-size:13.5px; font-weight:500; cursor:pointer; }
.edit-name .ms { font-size:17px; }
.field { display:block; margin-bottom:12px; }
.field span { display:block; margin:0 0 6px 4px; font-size:13px; color:var(--muted); }
.field input { display:block; width:100%; box-sizing:border-box; border:1px solid var(--line); border-radius:16px; background:var(--soft); color:var(--text); font:inherit; font-size:16px; padding:12px 14px; outline:none; -webkit-appearance:none; }
.field input::placeholder { color:var(--muted); opacity:.7; }
.field input:focus { border-color:var(--sage); background:var(--card); }
.field + .pill { margin-top:16px; }
.card .link-btn { width:100%; margin-top:6px; }

/* Экран «Готово» */
.done-screen { display:flex; flex-direction:column; align-items:center; gap:18px; padding:36px 8px 10px; text-align:center; }
.done-pic { position:relative; display:grid; place-items:center; width:132px; aspect-ratio:3/4; border-radius:24px; background:var(--card); color:var(--muted); }
.done-pic img { width:100%; height:100%; object-fit:cover; border-radius:24px; display:block; }
.done-pic > .ms { font-size:44px; }
.done-badge { position:absolute; right:-12px; bottom:-12px; width:46px; height:46px; border-radius:50%; background:var(--sage); color:#fff; display:grid; place-items:center; border:4px solid var(--bg); animation:pop .35s cubic-bezier(.3,1.6,.6,1) both .1s; }
.done-badge .ms { font-size:24px; }
.done-screen p { margin:-6px 0 0; max-width:310px; font-size:14px; color:var(--muted); }
@keyframes pop { from { transform:scale(.3); opacity:0; } }

/* Короткое подтверждение внизу экрана */
.toast { position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom)); z-index:20; display:flex; align-items:center; gap:9px; max-width:calc(100% - 32px); box-sizing:border-box; padding:9px 18px 9px 9px; border-radius:99px; background:var(--ink); color:var(--ink-text); font-size:14px; font-weight:500; box-shadow:0 6px 24px rgba(0,0,0,.18); opacity:0; transform:translate(-50%, 16px); transition:opacity .2s, transform .2s; pointer-events:none; }
.toast.on { opacity:1; transform:translate(-50%, 0); }
.toast .ms { flex:none; width:26px; height:26px; border-radius:50%; background:var(--sage); color:#fff; display:grid; place-items:center; font-size:17px; }

.loading { min-height:80vh; display:grid; place-items:center; padding:24px; text-align:center; font-size:16px; color:var(--muted); }
.spinner { width:28px; height:28px; border-radius:50%; border:3px solid var(--ring); border-top-color:var(--sage); animation:spin 1s linear infinite; }
@keyframes spin { to { rotate:360deg; } }
</style></head>
<body><div id="root"></div>
<script src="/app.js"></script>
</body></html>
